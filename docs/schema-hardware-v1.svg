<text x="1132" y="615" class="sm" fill="#666">Une résistance 330 Ω par LED • cathodes reliées au rail de masse.</text>

<!-- alimentation / notes -->
<rect x="48" y="855" width="500" height="360" rx="14" fill="#f6f8fa" stroke="#225baa" stroke-width="3"/><text x="70" y="892" class="s" fill="#225baa">ALIMENTATION</text>
<text x="76" y="930" class="b" fill="#222"><tspan x="76">Le Pico peut être alimenté :</tspan><tspan x="76" dy="28">• par USB (recommandé)</tspan><tspan x="76" dy="26">• ou par VSYS (5 V) via J2</tspan><tspan x="76" dy="38">LCD1602 :</tspan><tspan x="76" dy="28">• VDD + rétroéclairage sur VBUS 5 V</tspan><tspan x="76" dy="26">• masses sur rail commun</tspan><tspan x="76" dy="38">Découplage :</tspan><tspan x="76" dy="28">• C1 100 µF / 16 V</tspan><tspan x="76" dy="26">• C2 100 nF sur +5 V</tspan><tspan x="76" dy="26">• C3 100 nF sur +3,3 V</tspan></text>
<rect x="595" y="835" width="470" height="380" rx="14" fill="#f6f8fa" stroke="#225baa" stroke-width="3"/><text x="617" y="872" class="s" fill="#225baa">NOTES — V1</text>
<text x="620" y="920" class="b" fill="#222"><tspan x="620">• 8 switches : GP0 à GP7</tspan><tspan x="620" dy="37">• 8 LEDs : GP8, GP9, GP16 à GP21</tspan><tspan x="620" dy="37">• LCD : GP10 à GP15, mode 4 bits</tspan><tspan x="620" dy="37">• GP22, GP26, GP27, GP28 libres</tspan><tspan x="620" dy="37">• Pull-up internes pour les switches</tspan><tspan x="620" dy="37">• Connecteur SWD optionnel pour debug</tspan><tspan x="620" dy="37">• Rail de masse commun recommandé</tspan></text>

