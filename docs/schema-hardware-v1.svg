<!-- LEDs -->
<rect x="1110" y="135" width="742" height="510" rx="14" fill="#f6f8fa" stroke="#225baa" stroke-width="3"/><text x="1132" y="170" class="s" fill="#225baa">LEDS D'ÉTAT / RETOUR</text>
